name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FONT_DIR: .cache/typst-fonts
  TYPST_VERSION: 0.15.1

jobs:
  build:
    name: Compile PDF
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and template
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Restore pinned fonts
        id: font-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.FONT_DIR }}
          key: typst-fonts-${{ hashFiles('.github/scripts/install-fonts.sh') }}

      - name: Install pinned fonts
        if: steps.font-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/install-fonts.sh "$FONT_DIR"

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ env.TYPST_VERSION }}
          cache-dependency-path: bupt/deps.typ

      - name: Verify required fonts
        shell: bash
        run: |
          font_list="$(typst fonts --ignore-system-fonts --font-path "$FONT_DIR")"
          required_fonts=(
            "CaskaydiaMono NF"
            "Font Awesome 7 Brands"
            "Font Awesome 7 Free Solid"
            "Libertinus Serif"
            "Source Han Sans SC"
            "Source Han Serif SC"
            "STIX Two Math"
          )
          for family in "${required_fonts[@]}"; do
            grep --fixed-strings --line-regexp --quiet "$family" <<< "$font_list" || {
              echo "Missing required font: $family" >&2
              exit 1
            }
          done

      - name: Compile document
        shell: bash
        run: |
          mkdir -p dist
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          typst compile \
            --ignore-system-fonts \
            --font-path "$FONT_DIR" \
            --diagnostic-format short \
            main.typ dist/burp-archive.pdf

      - name: Upload preview PDF
        uses: actions/upload-artifact@v7
        with:
          name: burp-archive-pdf
          path: dist/burp-archive.pdf
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]{4}\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must look like v2026.1.0 or v2026.1.0-rc.1" >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tagged commit must already be part of main." >&2
            exit 1
          fi

      - name: Download compiled PDF
        uses: actions/download-artifact@v8
        with:
          name: burp-archive-pdf
          path: dist

      - name: Package release assets
        shell: bash
        run: |
          version="$GITHUB_REF_NAME"
          mv dist/burp-archive.pdf "dist/burp-archive-$version.pdf"
          zip -q -r "dist/burp-archive-attachments-$version.zip" \
            attachment LICENSE README.md
          (
            cd dist
            sha256sum \
              "burp-archive-$version.pdf" \
              "burp-archive-attachments-$version.zip" \
              > SHA256SUMS.txt
          )

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$GITHUB_REF_NAME"
          assets=(
            "dist/burp-archive-$version.pdf"
            "dist/burp-archive-attachments-$version.zip"
            "dist/SHA256SUMS.txt"
          )
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists; publish a new version instead of replacing assets." >&2
            exit 1
          fi
          prerelease=()
          [[ "$version" == *-* ]] && prerelease=(--prerelease)
          gh release create "$version" "${assets[@]}" \
            --verify-tag \
            --generate-notes \
            --title "BURP Archive $version" \
            "${prerelease[@]}"
